# Single-node VictoriaLogs. Endpoint: http://victoria-logs.<ns>.svc:9428
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-logs
  labels:
    app.kubernetes.io/name: victoria-logs
spec:
  selector:
    app.kubernetes.io/name: victoria-logs
  ports:
    - name: http
      port: 9428
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victoria-logs
  labels:
    app.kubernetes.io/name: victoria-logs
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: __STORAGE__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-logs
  labels:
    app.kubernetes.io/name: victoria-logs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: victoria-logs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoria-logs
    spec:
      securityContext:
        fsGroup: 65534
      containers:
        - name: victoria-logs
          image: victoriametrics/victoria-logs:v1.52.0
          args:
            - -storageDataPath=/var/lib/victoria-logs
            - -httpListenAddr=:9428
            - -retentionPeriod=__RETENTION__
          ports:
            - name: http
              containerPort: 9428
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/victoria-logs
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: victoria-logs

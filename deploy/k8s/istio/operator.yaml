# Inject Tapline on every pod Istio injects.
#   istioctl install -f deploy/k8s/istio/operator.yaml
#
# nft (in the template) steals:
#   uid 1337 (istio-proxy) → :15003  (inbound sandwich, any app port via SO_ORIGINAL_DST)
#   other uids             → :15005  (outbound)
apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
metadata:
  name: tapline
spec:
  values:
    sidecarInjectorWebhook:
      defaultTemplates:
        - sidecar
        - tapline
      templates:
        tapline: |
          spec:
            initContainers:
            - name: nft-tapline
              image: tapline-nft:0.1
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh","-c"]
              args:
              - |
                set -eu
                POD_IP="${POD_IP:-127.0.0.1}"
                nft delete table ip tapline 2>/dev/null || true
                nft -f - <<EOF
                table ip tapline {
                  chain output {
                    type nat hook output priority -150; policy accept;
                    skuid 1338 return
                    tcp dport { 53, 15000, 15001, 15002, 15003, 15005, 15006, 15008, 15021, 15090 } return
                    udp dport { 15000, 15001, 15002, 15003, 15005, 15006, 15008, 15021, 15090 } return
                    skuid 1337 ip daddr { 127.0.0.0/8, ${POD_IP} } meta l4proto tcp redirect to :15003
                    skuid 1337 ip daddr { 127.0.0.0/8, ${POD_IP} } meta l4proto udp redirect to :15003
                    skuid 1337 return
                    meta l4proto tcp redirect to :15005
                    meta l4proto udp redirect to :15005
                  }
                }
                EOF
              env:
                - name: POD_IP
                  valueFrom:
                    fieldRef:
                      fieldPath: status.podIP
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                runAsNonRoot: false
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: true
                capabilities:
                  add: ["NET_ADMIN", "NET_RAW"]
            containers:
            - name: tapline
              image: tapline:0.1
              env:
              - name: TAPLINE_INBOUND
                value: "0.0.0.0:15003"
              - name: TAPLINE_APP
                value: "127.0.0.1:8080"
              - name: TAPLINE_OUTBOUND
                value: "0.0.0.0:15005"
              - name: TAPLINE_ADMIN
                value: "127.0.0.1:15002"
              - name: TAPLINE_RUN_ORIGIN
                value: "0"
              - name: TAPLINE_SINK
                value: "stdout"
              - name: TAPLINE_INSTANCE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: TAPLINE_NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              securityContext:
                runAsUser: 1338
                runAsGroup: 1338
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: "1"
                  memory: 256Mi
        tapline-gateway: |
          spec:
            initContainers:
            - name: nft-tapline
              image: tapline-nft:0.1
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh","-c"]
              args:
              - |
                set -eu
                POD_IP="${POD_IP:-127.0.0.1}"
                nft delete table ip tapline 2>/dev/null || true
                nft -f - <<EOF
                table ip tapline {
                  chain output {
                    type nat hook output priority -150; policy accept;
                    skuid 1338 return
                    tcp dport { 53, 15000, 15001, 15002, 15003, 15005, 15006, 15008, 15010, 15012, 15014, 15017, 15021, 15090 } return
                    udp dport { 15000, 15001, 15002, 15003, 15005, 15006, 15008, 15010, 15012, 15014, 15017, 15021, 15090 } return
                    skuid 1337 ip daddr { 127.0.0.0/8, ${POD_IP} } return
                    skuid 1337 meta l4proto tcp redirect to :15005
                    skuid 1337 meta l4proto udp redirect to :15005
                  }
                }
                EOF
              env:
                - name: POD_IP
                  valueFrom:
                    fieldRef:
                      fieldPath: status.podIP
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                runAsNonRoot: false
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: true
                capabilities:
                  add: ["NET_ADMIN", "NET_RAW"]
            containers:
            - name: tapline
              image: tapline:0.1
              imagePullPolicy: IfNotPresent
              env:
              - name: TAPLINE_INBOUND
                value: "0.0.0.0:15003"
              - name: TAPLINE_OUTBOUND
                value: "0.0.0.0:15005"
              - name: TAPLINE_RUN_ORIGIN
                value: "0"
              - name: TAPLINE_SINK
                value: "stdout"
              - name: TAPLINE_INSTANCE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: TAPLINE_NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              securityContext:
                runAsUser: 1338
                runAsGroup: 1338
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]

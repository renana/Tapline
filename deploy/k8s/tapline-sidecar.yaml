# Example pod: Tapline + Envoy + app.
# Service should still target the *app* port. nft REDIRECT steals inbound TCP
# onto Tapline :15000; Tapline splices to Envoy on 127.0.0.1:15001.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tapline-nft
data:
  nft-redirect.sh: |
    #!/bin/sh
    set -eu
    DATAPLANE_PORT="${TAPLINE_PORT:-15000}"
    SKIP_PORTS="${SKIP_PORTS:-15000,15001,15002}"
    APP_UID="${TAPLINE_UID:-1337}"
    nft -f - <<EOF
    flush ruleset
    table ip tapline {
      chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;
        tcp dport { ${SKIP_PORTS} } return
        meta l4proto tcp redirect to :${DATAPLANE_PORT}
      }
      chain output {
        type nat hook output priority dstnat; policy accept;
        skuid ${APP_UID} return
        tcp dport { ${SKIP_PORTS} } return
      }
    }
    EOF
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tapline-fronted
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tapline-fronted
  template:
    metadata:
      labels:
        app: tapline-fronted
    spec:
      shareProcessNamespace: false
      initContainers:
        - name: nft-redirect
          image: alpine:3.20
          command: ["/bin/sh", "-c"]
          args:
            - apk add --no-cache nftables >/dev/null && exec /nft/nft-redirect.sh
          env:
            - name: TAPLINE_PORT
              value: "15000"
            - name: SKIP_PORTS
              value: "15000,15001,15002"
            - name: TAPLINE_UID
              value: "1337"
          securityContext:
            capabilities:
              add: ["NET_ADMIN", "NET_RAW"]
            # nft needs to change the pod netns; drop this if your policy forbids it
            # and use a CNI / privileged init instead.
          volumeMounts:
            - name: nft
              mountPath: /nft
              readOnly: true
      containers:
        - name: tapline
          image: tapline:0.1          # docker build -t tapline:0.1 -f proxy/Dockerfile proxy
          imagePullPolicy: IfNotPresent
          env:
            - name: TAPLINE_LISTEN
              value: "0.0.0.0:15000"
            - name: TAPLINE_ENVOY
              value: "127.0.0.1:15001"
            - name: TAPLINE_ADMIN
              value: "127.0.0.1:15002"
            - name: TAPLINE_RUN_ORIGIN
              value: "0"
            - name: TAPLINE_PROXY_PROTOCOL
              value: "1"
          ports:
            - name: dataplane
              containerPort: 15000
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: 15000
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 15000
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            runAsUser: 1337
            runAsGroup: 1337
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        - name: envoy
          image: envoyproxy/envoy:v1.31-latest
          args: ["-c", "/etc/envoy/envoy.yaml"]
          ports:
            - name: envoy
              containerPort: 15001
          volumeMounts:
            - name: envoy
              mountPath: /etc/envoy
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
        - name: app
          image: your-app:latest      # replace
          ports:
            - name: http
              containerPort: 8080
      volumes:
        - name: nft
          configMap:
            name: tapline-nft
            defaultMode: 0755
        - name: envoy
          configMap:
            name: envoy-tapline
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-tapline
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: from_tapline
          address:
            socket_address: { address: 127.0.0.1, port_value: 15001 }
          listener_filters:
            - name: envoy.filters.listener.proxy_protocol
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.listener.proxy_protocol.v3.ProxyProtocol
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress
                    use_remote_address: true
                    route_config:
                      name: local_route
                      virtual_hosts:
                        - name: app
                          domains: ["*"]
                          routes:
                            - match: { prefix: "/" }
                              route: { cluster: app }
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: app
          type: STATIC
          load_assignment:
            cluster_name: app
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: 127.0.0.1, port_value: 8080 }
    admin:
      address:
        socket_address: { address: 127.0.0.1, port_value: 9901 }
---
apiVersion: v1
kind: Service
metadata:
  name: tapline-fronted
spec:
  selector:
    app: tapline-fronted
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP

# Vector DaemonSet: Tapline audit JSON (app=tapline) → VictoriaLogs.
# Endpoint is filled by deploy.sh (__VICTORIALOGS_URL__).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector
  labels:
    app.kubernetes.io/name: vector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vector
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vector
subjects:
  - kind: ServiceAccount
    name: vector
    namespace: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector
  labels:
    app.kubernetes.io/name: vector
data:
  vector.yaml: |
    data_dir: /var/lib/vector

    sources:
      kubernetes:
        type: kubernetes_logs
        glob_minimum_cooldown_ms: 2000

    transforms:
      parse:
        type: remap
        inputs: [kubernetes]
        source: |
          # Tapline audit hops only (JSON with app=tapline). Drop stderr banners
          # and every other container.
          if .kubernetes.container_name != "tapline" {
            abort
          }
          parsed, err = parse_json(.message)
          if err != null || !is_object(parsed) || parsed.app != "tapline" {
            abort
          }
          . = merge!(., parsed)
          if !exists(._msg) {
            ._msg = .message
          }
          if !exists(._time) {
            ._time = .timestamp
          }
          if !exists(.instance) {
            .instance = .kubernetes.pod_name
          }
          if !exists(.namespace) {
            .namespace = .kubernetes.pod_namespace
          }

    sinks:
      victorialogs:
        type: elasticsearch
        inputs: [parse]
        endpoints:
          - "__VICTORIALOGS_URL__/insert/elasticsearch/"
        api_version: v8
        compression: gzip
        healthcheck:
          enabled: false
        query:
          _msg_field: _msg
          _time_field: _time
          _stream_fields: app,namespace,instance,direction,kubernetes.container_name
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector
  labels:
    app.kubernetes.io/name: vector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vector
    spec:
      serviceAccountName: vector
      dnsPolicy: ClusterFirst
      tolerations:
        - operator: Exists
      containers:
        - name: vector
          image: timberio/vector:0.44.0-distroless-libc
          args: ["--config", "/etc/vector/vector.yaml"]
          env:
            - name: VECTOR_LOG
              value: info
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: VECTOR_SELF_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: VECTOR_SELF_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/vector
              readOnly: true
            - name: data
              mountPath: /var/lib/vector
            - name: varlog
              mountPath: /var/log
              readOnly: true
          securityContext:
            runAsUser: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: vector
        - name: data
          hostPath:
            path: /var/lib/vector
            type: DirectoryOrCreate
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory
